[project]
name = "agentforge-research"
version = "0.1.0"
description = "Autonomous agentic AI research framework"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests/backend"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
